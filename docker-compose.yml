name: ontime
services:
  core:
    build: ./core
    environment:
      DB_PATH: /data/ontime.sqlite3
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PARTNER_KEYS: ${PARTNER_KEYS:-}
    volumes: [ontime_data:/data]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [core]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [gateway]
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
volumes:
  ontime_data:


