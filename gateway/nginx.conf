limit_req_zone $binary_remote_addr zone=ontime:1m rate=12r/s;
server {
    listen 80;
    client_max_body_size 32k;
    limit_req_status 429;
    error_page 429 = @limited;
    location @limited {
        default_type application/json;
        return 429 '{"error":"Rate limit exceeded"}';
    }
    location = /api {
        limit_req zone=ontime burst=24 nodelay;
        proxy_pass http://core:8000;
    }
    location /api/ {
        limit_req zone=ontime burst=24 nodelay;
        proxy_set_header Host $host;
        proxy_pass http://core:8000;
    }
    location / { return 404; }
}

